services:
  pulse-landing-page:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-landing-page
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

