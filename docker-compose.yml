services:
  pulse-landing-page:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set PUBLIC_URL to empty string for absolute paths from root (recommended for nginx)
        - PUBLIC_URL=${PUBLIC_URL:-}
        # Optional: Pass other environment variables if needed
        - REACT_APP_ENABLE_VISUAL_EDITS=${REACT_APP_ENABLE_VISUAL_EDITS:-}
        - REACT_APP_ENABLE_HEALTH_CHECK=${REACT_APP_ENABLE_HEALTH_CHECK:-}
        - DISABLE_HOT_RELOAD=${DISABLE_HOT_RELOAD:-}
    container_name: pulse-landing-page
    ports:
      - "3001:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

